<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Pré-conexão com os servidores do Google para acelerar o carregamento -->
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    
    <!-- Item 1: Título da aba do navegador -->
    <title>Novidades PLH</title>
    
    <!-- Item 3: Metadados para Redes Sociais (WhatsApp, etc.) -->
    <meta property="og:title" content="Fique por dentro - PLH">
    <meta property="og:description" content="Acesse as últimas notícias, artigos e atualizações do Professor Luiz Henrique.">
    <!-- Importante: A imagem 'social-preview.png' deve estar na raiz do seu repositório no GitHub -->
    <meta property="og:image" content="social-preview.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Estilos personalizados para a animação suave de expansão estilo FAQ */
        .faq-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s ease-out;
        }
        .faq-content.open {
            grid-template-rows: 1fr;
        }
        .faq-content-inner {
            overflow: hidden;
        }
        
        /* Rotação do ícone ao expandir */
        .chevron-icon {
            transition: transform 0.3s ease;
        }
        .open .chevron-icon {
            transform: rotate(180deg);
        }

        /* Menu Mobile Animado */
        #mobile-menu {
            transition: max-height 0.3s ease-in-out;
            max-height: 0;
            overflow: hidden;
        }
        #mobile-menu.menu-open {
            max-height: 250px; /* Ajuste conforme a quantidade de itens no menu */
        }

        /* Estilos do Modal Admin */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        .hidden { display: none !important; }

        /* Esconder o iframe click overlay após o clique inicial */
        .yt-unlocked iframe {
            pointer-events: auto !important;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen relative pb-16">

    <!-- Cabeçalho do Site com Menu Hambúrguer -->
    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <!-- Título do Site -->
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-blue-900 flex items-center gap-2 truncate">
                <i data-lucide="book-open" class="w-6 h-6 shrink-0"></i>
                Novidades PLH
            </h1>
            
            <!-- Botão do Menu Hambúrguer (Visível agora em todas as telas) -->
            <button onclick="window.toggleMobileMenu()" class="p-2 text-gray-600 hover:text-blue-900 focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Container do Menu Mobile (Expansível em todas as telas) -->
        <div id="mobile-menu" class="bg-white border-t border-gray-100 px-4 shadow-sm">
            <nav class="flex flex-col py-4 gap-4 text-sm font-medium text-gray-600">
                <a href="#" class="hover:text-blue-900 transition-colors">Início</a>
                <a href="#" class="hover:text-blue-900 transition-colors">Sobre</a>
                <a href="#" class="hover:text-blue-900 transition-colors">Contato</a>
                <!-- Engrenagem Escondida no Menu -->
                <div class="border-t border-gray-100 pt-3 mt-1">
                    <a href="#" onclick="window.openAdminLogin(); return false;" class="flex items-center gap-2 text-gray-400 hover:text-blue-900 transition-colors">
                        <i data-lucide="settings" class="w-4 h-4"></i> Painel
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Área Principal de Postagens -->
    <main class="max-w-3xl mx-auto px-4 py-8 z-10">
        
        <div class="mb-8 text-center sm:text-left">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Últimas Atualizações</h2>
            <p class="text-gray-500">Fique por dentro das novidades, dicas e informativos.</p>
        </div>

        <!-- Contêiner do Feed com Skeleton Loader (Melhora a percepção de velocidade) -->
        <div id="feed-container" class="flex flex-col gap-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden animate-pulse">
                <div class="h-48 sm:h-64 bg-gray-200 w-full"></div>
                <div class="p-6">
                    <div class="h-8 bg-gray-200 rounded w-3/4 mb-3"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
                    <div class="h-4 bg-gray-200 rounded w-full mb-2"></div>
                    <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden animate-pulse hidden sm:block opacity-60">
                <div class="h-48 sm:h-64 bg-gray-200 w-full"></div>
                <div class="p-6">
                    <div class="h-8 bg-gray-200 rounded w-3/4 mb-3"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- Modais do Painel Administrativo -->
    
    <!-- Modal 1: Login -->
    <div id="login-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay px-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 relative">
            <button onclick="window.closeAdminLogin()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2"><i data-lucide="lock" class="w-5 h-5 text-blue-900"></i> Acesso Restrito</h3>
            <p class="text-sm text-gray-500 mb-4">Insira a senha do professor para acessar o painel.</p>
            <input type="password" id="admin-password" placeholder="Senha" class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-900">
            <button onclick="window.verifyPassword()" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-medium py-2 rounded-lg transition-colors">Entrar</button>
            <p id="login-error" class="text-red-500 text-sm mt-2 hidden">Senha incorreta.</p>
        </div>
    </div>

    <!-- Modal 2: Dashboard (Lista de Posts) -->
