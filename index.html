    <script>
        const savedTheme = localStorage.getItem('site-theme') || 'light';
        const savedFontSize = localStorage.getItem('site-font-size') || 'normal';
        document.documentElement.classList.add('theme-' + savedTheme);
        document.documentElement.classList.add('font-size-' + savedFontSize);

        window.addEventListener('load', () => {
            const manifest = {
                name: "PLH - Reflexões de Fé",
                short_name: "PLH",
                start_url: window.location.pathname,
                display: "standalone",
                background_color: "#f3f4f6",
                theme_color: "#1e3a8a",
                icons: [
                    { src: "./foto-compartilhamento.png", sizes: "192x192", type: "image/png" },
                    { src: "./foto-compartilhamento.png", sizes: "512x512", type: "image/png" }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(manifestBlob);
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', (e) => {}); 
                `;
                const swBlob = new Blob([swCode], {type: 'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
            }
        });

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('install-btn');
            const btnMob = document.getElementById('install-btn-mobile');
            if(btn) btn.classList.remove('hidden');
            if(btnMob) btnMob.classList.remove('hidden');
        });

        window.installApp = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    const btn = document.getElementById('install-btn');
                    const btnMob = document.getElementById('install-btn-mobile');
                    if(btn) btn.classList.add('hidden');
                    if(btnMob) btnMob.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        };
    </script>

                </div>
            </div>
            <div class="p-6 border-t bg-gray-50 flex justify-between"><button id="btn-delete-editor" onclick="window.deletePost(document.getElementById('edit-post-id').value, true)" class="text-red-600 font-bold px-4">Excluir</button><div class="flex gap-3 ml-auto"><button onclick="window.closeEditor()" class="px-6 py-2.5 border rounded-xl">Sair</button><button onclick="window.savePost()" class="px-8 py-2.5 bg-blue-900 text-white rounded-xl font-bold shadow-lg">Salvar</button></div></div>
        </div>
    </div>

    <div id="book-editor-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay px-4 py-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-full flex flex-col relative overflow-hidden text-gray-900">
            <div class="p-5 border-b flex justify-between items-center bg-green-50/50"><h3 id="book-editor-title" class="text-xl font-bold">Livro</h3><button onclick="window.closeBookEditor()" class="text-gray-400"><i data-lucide="x" class="w-6 h-6"></i></button></div>
            <div class="p-6 flex-1 overflow-y-auto flex flex-col gap-6">
                <input type="hidden" id="edit-book-id">
                <div class="bg-green-50/30 p-5 rounded-xl border flex gap-4"><label><input type="radio" name="book_price_mode" value="paid" onchange="window.toggleBookPriceMode()" checked> Pago</label><label><input type="radio" name="book_price_mode" value="free" onchange="window.toggleBookPriceMode()"> Gratuito</label></div>
                <div class="grid grid-cols-2 gap-4"><input type="text" id="book-title" placeholder="Título" class="border rounded-xl px-4 py-2.5"><input type="text" id="book-subtitle" placeholder="Subtítulo (Galeria)" class="border rounded-xl px-4 py-2.5"></div>
                <div class="grid grid-cols-3 gap-4"><input type="text" id="book-cover" placeholder="Link Capa" class="border rounded-xl px-4 py-2.5"><input type="number" id="book-pages" placeholder="Páginas" class="border rounded-xl px-4 py-2.5"><select id="book-format" class="border rounded-xl px-4 py-2.5"><option value="Físico">Físico</option><option value="E-book">E-book</option><option value="Físico e E-book">Físico e E-book</option></select></div>
                <div id="book-paid-fields" class="bg-gray-50 p-5 rounded-xl border grid grid-cols-2 gap-4"><input type="text" id="book-price" placeholder="Preço"><input type="text" id="book-btn-text" placeholder="Botão (Ex: Comprar)"><input type="text" id="book-link-paid" placeholder="Link Venda" class="col-span-2"><input type="text" id="book-sample" placeholder="Amostra PDF" class="col-span-2"></div>
                <div id="book-free-fields" class="bg-blue-50 p-5 rounded-xl border hidden"><input type="text" id="book-link-free" placeholder="Link Download" class="w-full"></div>
                <div>
                    <label class="block text-sm font-bold mb-1">Sinopse da Página de Vendas</label>
                    <div class="border border-b-0 rounded-t-xl bg-gray-50 px-4 py-3 flex flex-wrap gap-2"><button type="button" onclick="window.execEditor('bold')" class="p-2 bg-white border rounded"><i data-lucide="bold" class="w-4 h-4"></i></button><button type="button" onclick="window.insertEditorImage()" class="px-3 py-1 bg-white border rounded text-sm">Img</button></div>
                    <div id="book-fulltext" contenteditable="true" class="w-full border rounded-b-xl px-6 py-6 min-h-[300px] bg-white overflow-y-auto prose prose-green max-w-none shadow-inner outline-none"></div>
                </div>
            </div>
            <div class="p-6 border-t bg-gray-50 flex justify-between"><button id="btn-delete-book" onclick="window.deleteBook(document.getElementById('edit-book-id').value)" class="text-red-600 font-bold px-4">Remover</button><div class="flex gap-3 ml-auto"><button onclick="window.closeBookEditor()" class="px-6 py-2.5 border rounded-xl">Sair</button><button onclick="window.saveBook()" class="px-8 py-2.5 bg-green-700 text-white rounded-xl font-bold shadow-lg">Salvar</button></div></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCg5aIHRDyOPHDwrP_OFYMn2AE9euWVOyw", authDomain: "professorluizhenrique-a9fe9.firebaseapp.com", projectId: "professorluizhenrique-a9fe9", storageBucket: "professorluizhenrique-a9fe9.firebasestorage.app", messagingSenderId: "354928637639", appId: "1:354928637639:web:fd144793b51237618ff0e2" };
        const ADMIN_PASSWORD = "Biguidu2013@"; let blogPosts = [], siteCategories = [], siteBooks = [], currentCategoryFilter = null, currentOpenBookId = null;
        const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), appId = 'plh-blog-default';
        window.currentEditorId = 'post-fulltext';

        window.updateCategoriesMenu = () => {
            const allCats = [...new Set([...siteCategories.map(c=>c.name), ...blogPosts.map(p=>p.category).filter(c=>c)])].sort();
            const sid = document.getElementById('categories-list'), bot = document.getElementById('bottom-categories-list');
            const html = allCats.map(c => `<button onclick="window.filterByCategory('${c.replace(/'/g, "\\'")}'); window.toggleMobileMenu(); window.toggleCategoriesModal(true);" class="w-full text-left py-3 px-4 hover:sys-text-accent font-bold flex items-center gap-3"><i data-lucide="folder" class="w-4 h-4"></i> ${c}</button>`).join('');
            if(sid) sid.innerHTML = html; if(bot) bot.innerHTML = html;
            lucide.createIcons();
        };

        window.onload = async () => {
            try { await signInAnonymously(auth); } catch (e) {}
            onAuthStateChanged(auth, (user) => { if (user) {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (s) => { blogPosts = []; s.forEach(d => { blogPosts.push({ id: d.id, ...d.data() }); }); blogPosts.sort((a,b)=>b.createdAt - a.createdAt); window.updateCategoriesMenu(); window.renderPostsFeed(); });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'categories'), (s) => { siteCategories = []; s.forEach(d => { siteCategories.push({ id: d.id, ...d.data() }); }); siteCategories.sort((a,b)=>b.createdAt - a.createdAt); window.updateCategoriesMenu(); });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'books'), (s) => { siteBooks = []; s.forEach(d => { siteBooks.push({ id: d.id, ...d.data() }); }); siteBooks.sort((a,b)=>b.createdAt - a.createdAt); window.renderLibrary(); if(currentOpenBookId) window.renderBookDetailContent(currentOpenBookId); });
                const url = new URLSearchParams(window.location.search); if(url.get('post')) { window.history.replaceState({}, '', window.location.pathname); window.openArticle(url.get('post')); }
            }});
        };

        window.toggleMobileMenu = () => { const s = document.getElementById('sidebar-menu'), o = document.getElementById('sidebar-overlay'); if (s.classList.contains('-translate-x-full')) { s.classList.remove('-translate-x-full'); o.classList.remove('hidden'); setTimeout(()=>o.classList.remove('opacity-0'),10); } else { s.classList.add('-translate-x-full'); o.classList.add('opacity-0'); setTimeout(()=>o.classList.add('hidden'),300); } };
        window.toggleCategories = (e) => { if(e) e.stopPropagation(); const l = document.getElementById('categories-list'), c = document.getElementById('cat-chevron'); if(l) l.classList.toggle('hidden'); if(c) c.classList.toggle('rotate-180'); };
        window.toggleCategoriesModal = (forceClose) => { const m = document.getElementById('categories-modal'), i = m.querySelector('.slide-up-animation'); if(m.classList.contains('hidden') && !forceClose) { m.classList.remove('hidden'); setTimeout(()=>i.classList.remove('translate-y-full'),10); } else { i.classList.add('translate-y-full'); setTimeout(()=>m.classList.add('hidden'),300); } };
        window.filterByCategory = (cat) => { currentCategoryFilter = cat; window.showHome(); };
        window.clearFilter = () => { currentCategoryFilter = null; window.showHome(); };
        window.showHome = () => { ['article-view','library-view','book-detail-view'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.getElementById('home-view').classList.remove('hidden'); window.renderPostsFeed(); window.scrollTo(0,0); };
        window.showLibrary = () => { ['home-view','article-view','book-detail-view'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.getElementById('library-view').classList.remove('hidden'); window.scrollTo(0,0); };
        window.setSiteTheme = (t) => { document.documentElement.className = document.documentElement.className.replace(/theme-\w+/g, '') + ' theme-' + t; localStorage.setItem('site-theme', t); };
        window.cycleFontSize = () => { const h = document.documentElement; let n = h.classList.contains('font-size-normal') ? 'large' : (h.classList.contains('font-size-large') ? 'xlarge' : 'normal'); h.className = h.className.replace(/font-size-\w+/g, '') + ' font-size-' + n; localStorage.setItem('site-font-size', n); };

        window.renderPostsFeed = () => {
            const container = document.getElementById('feed-container'); container.innerHTML = '';
            let posts = blogPosts.filter(p => p.status !== 'draft');
            if (currentCategoryFilter) posts = posts.filter(p => (p.category || '').toLowerCase() === currentCategoryFilter.toLowerCase());
            posts.forEach(p => {
                const article = document.createElement('article'); article.className = 'sys-bg-surface rounded-2xl shadow-sm sys-border border overflow-hidden hover:shadow-xl transition-all cursor-pointer';
                const ytId = window.getYoutubeId(p.youtubeUrl);
                const media = ytId ? `<div class="aspect-video bg-black relative overflow-hidden"><iframe class="absolute inset-0 w-full h-full pointer-events-none transform scale-[1.35]" src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&rel=0&loop=1&playlist=${ytId}&playsinline=1" allow="autoplay"></iframe><div class="absolute inset-0 z-10 flex items-center justify-center bg-black/20"><div class="w-16 h-16 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border border-white/30"><svg class="w-7 h-7 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div></div>` : `<div class="aspect-video bg-gray-100"><img src="${window.getDriveImageUrl(p.imageUrl)}" class="w-full h-full object-cover"></div>`;
                article.innerHTML = `<div onclick="window.${p.type==='page'?'openArticle':'togglePost'}('${p.id}')">${media}<div class="p-6"><div class="flex gap-2 mb-3"><span class="sys-bg-accent text-white text-[9px] font-black px-2 py-0.5 rounded-full uppercase">${p.type}</span>${p.category?`<span class="sys-bg-body text-[9px] font-bold px-2 py-0.5 rounded-full border">${p.category}</span>`:''}</div><h3 class="text-2xl font-black mb-2">${p.title}</h3><p class="sys-text-secondary text-sm line-clamp-2">${p.subtitle}</p><div class="flex items-center justify-between pt-4 mt-4 sys-border border-t"><div class="sys-text-accent font-black text-xs uppercase">Ler mais</div><button onclick="window.sharePost('${p.id}', '${p.title}', '${p.subtitle}', event)" class="p-2 sys-text-secondary"><i data-lucide="share-2" class="w-5 h-5"></i></button></div></div></div>${p.type!=='page'?`<div id="content-${p.id}" class="faq-content sys-bg-body sys-border border-t"><div class="faq-content-inner p-8 prose max-w-none">${p.fullText}</div></div>`:''}`;
                container.appendChild(article);
            });
            lucide.createIcons();
        };

        window.openArticle = (id) => { const p = blogPosts.find(x => x.id === id); if (!p) return; ['home-view','library-view','book-detail-view'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.getElementById('article-view').classList.remove('hidden'); window.scrollTo(0,0); const ytId = window.getYoutubeId(p.youtubeUrl); const media = ytId ? `<div class="aspect-video rounded-3xl overflow-hidden mb-8 shadow-2xl bg-black"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>` : `<div class="aspect-video rounded-3xl overflow-hidden mb-8 shadow-xl"><img src="${window.getDriveImageUrl(p.imageUrl)}" class="w-full h-full object-cover"></div>`; document.getElementById('article-content').innerHTML = `${media}<h1 class="text-4xl font-black mb-6">${p.title}</h1><p class="text-xl italic sys-text-secondary mb-10 pb-10 border-b">${p.subtitle}</p><div class="prose max-w-none">${p.fullText}</div>`; lucide.createIcons(); };
        window.openBookDetail = (id) => { currentOpenBookId = id; ['home-view','library-view','article-view'].forEach(i=>document.getElementById(i).classList.add('hidden')); document.getElementById('book-detail-view').classList.remove('hidden'); window.renderBookDetailContent(id); window.scrollTo(0,0); };
        window.renderBookDetailContent = (id) => {
            const b = siteBooks.find(x => x.id === id); if (!b) return;
            const link = (b.link||'#').startsWith('http') ? b.link : 'https://'+b.link;
            const sample = b.sampleLink ? `<a href="${b.sampleLink}" target="_blank" class="flex-1 py-4 border-2 rounded-xl text-center font-bold">Ler Amostra</a>` : '';
            document.getElementById('book-detail-content').innerHTML = `<div class="flex flex-col md:flex-row gap-10"><div class="w-full md:w-1/3"><img src="${window.getDriveImageUrl(b.cover)}" class="rounded-2xl shadow-2xl w-full border"><div class="flex justify-around mt-6 p-4 border rounded-2xl bg-white shadow-sm"><button onclick="window.likeBook('${b.id}')" class="flex flex-col items-center gap-1 text-red-500 font-bold"><i data-lucide="heart" class="fill-current"></i>${b.likes||0}</button><div class="flex flex-col items-center gap-1 opacity-50"><i data-lucide="message-square"></i>${(b.comments||[]).length}</div></div></div><div class="flex-1"><h1 class="text-4xl font-black mb-2">${b.title}</h1><p class="text-2xl font-black text-green-600 mb-6">${b.priceMode==='free'?'GRATUITO':b.price}</p><div class="prose max-w-none mb-10">${b.fullText}</div><div class="flex flex-col sm:flex-row gap-4">${b.priceMode==='free'?`<a href="${link}" target="_blank" class="flex-1 py-4 bg-blue-700 text-white rounded-xl text-center font-black">BAIXAR COMPLETO</a>`:`<a href="${link}" target="_blank" class="flex-1 py-4 sys-bg-accent text-white rounded-xl text-center font-black">COMPRAR AGORA</a>${sample}`}</div></div></div><div class="mt-12 pt-10 border-t"><h3 class="text-2xl font-black mb-6">Comentários</h3><div class="bg-white p-6 rounded-2xl border mb-8 shadow-sm"><textarea id="com-txt" rows="3" placeholder="Comentário..." class="w-full border rounded-xl p-4 mb-3 outline-none"></textarea><button onclick="window.submitBookComment('${b.id}')" class="bg-blue-900 text-white px-8 py-2 rounded-xl font-bold">Enviar</button></div><div class="flex flex-col gap-4">${(b.comments||[]).slice().reverse().map(c=>`<div class="p-4 bg-white rounded-xl border"><p class="font-bold text-sm mb-1">${c.name}</p><p class="text-sm opacity-80">${c.text}</p></div>`).join('')}</div></div>`;
            lucide.createIcons();
        };

        window.submitBookComment = async (id) => { const txt = document.getElementById('com-txt').value.trim(); if(!txt) return; await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'books', id), { comments: arrayUnion({ name: 'Leitor', text: txt, date: Date.now() }) }); document.getElementById('com-txt').value = ''; };
        window.likeBook = async (id) => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'books', id), { likes: increment(1) }); };
        window.openAdminLogin = () => { document.getElementById('login-modal').classList.remove('hidden'); };
        window.closeAdminLogin = () => document.getElementById('login-modal').classList.add('hidden');
        window.verifyPassword = () => { if (document.getElementById('admin-password').value === ADMIN_PASSWORD) { window.closeAdminLogin(); document.getElementById('dashboard-modal').classList.remove('hidden'); window.switchAdminTab('posts'); } else { document.getElementById('login-error').classList.remove('hidden'); } };
        window.closeDashboard = () => document.getElementById('dashboard-modal').classList.add('hidden');
        window.switchAdminTab = (t) => { ['posts', 'books', 'categories'].forEach(x => document.getElementById('admin-view-'+x).classList.add('hidden')); document.getElementById('admin-view-'+t).classList.remove('hidden'); if(t==='posts') window.renderAdminList(); if(t==='books') window.renderAdminBooks(); if(t==='categories') window.renderAdminCategories(); };
        window.renderAdminList = () => { document.getElementById('admin-posts-list').innerHTML = blogPosts.map(p => `<div class="p-4 border rounded-xl bg-white flex justify-between"><b>${p.title}</b><div class="flex gap-2"><button onclick="window.editPost('${p.id}')"><i data-lucide="edit"></i></button><button onclick="window.deletePost('${p.id}')"><i data-lucide="trash"></i></button></div></div>`).join(''); lucide.createIcons(); };
        window.renderAdminBooks = () => { document.getElementById('admin-books-list').innerHTML = siteBooks.map(b => `<div onclick="window.editBook('${b.id}')" class="p-4 border rounded-xl bg-white cursor-pointer hover:border-blue-500"><b>${b.title}</b></div>`).join(''); lucide.createIcons(); };
        window.toggleBookPriceMode = () => { const m = document.querySelector('input[name="book_price_mode"]:checked').value; document.getElementById('book-paid-fields').classList.toggle('hidden', m==='free'); document.getElementById('book-free-fields').classList.toggle('hidden', m==='paid'); };
        window.openBookEditor = () => { window.currentEditorId='book-fulltext'; document.getElementById('edit-book-id').value=''; document.getElementById('book-fulltext').innerHTML=''; document.getElementById('book-editor-modal').classList.remove('hidden'); };
        window.saveBook = async () => { const id = document.getElementById('edit-book-id').value, m = document.querySelector('input[name="book_price_mode"]:checked').value; const data = { title: document.getElementById('book-title').value, fullText: document.getElementById('book-fulltext').innerHTML, priceMode: m, price: document.getElementById('book-price').value, cover: document.getElementById('book-cover').value, link: m==='free'?document.getElementById('book-link-free').value:document.getElementById('book-link-paid').value, createdAt: Date.now() }; if(id) await updateDoc(doc(db,'artifacts',appId,'public','data','books',id), data); else await addDoc(collection(db,'artifacts',appId,'public','data','books'), data); window.closeBookEditor(); };
        window.editBook = (id) => { window.currentEditorId='book-fulltext'; const b = siteBooks.find(x=>x.id===id); document.getElementById('edit-book-id').value=b.id; document.getElementById('book-title').value=b.title; document.getElementById('book-fulltext').innerHTML=b.fullText; document.getElementById('book-editor-modal').classList.remove('hidden'); };
        window.renderLibrary = () => { document.getElementById('library-container').innerHTML = siteBooks.map(b => `<div onclick="window.openBookDetail('${b.id}')" class="border rounded-2xl overflow-hidden sys-bg-surface cursor-pointer shadow-sm"><img src="${window.getDriveImageUrl(b.cover)}" class="aspect-[2/3] object-cover w-full"><div class="p-4 text-center font-black">${b.title}</div></div>`).join(''); };
        window.closeEditor = () => document.getElementById('editor-modal').classList.add('hidden');
        window.closeBookEditor = () => document.getElementById('book-editor-modal').classList.add('hidden');
        window.execEditor = (c,v) => { document.execCommand(c,false,v); document.getElementById(window.currentEditorId).focus(); };
        window.insertEditorImage = () => { const u = prompt("URL:"); if(u) window.execEditor('insertHTML', `<img src="${window.getDriveImageUrl(u)}" class="w-full rounded-xl my-4">`); };
        window.getYoutubeId = (u) => { if(!u) return null; const m = u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/); return (m && m[2].length===11)?m[2]:null; };
        window.insertEditorVideo = () => { const u = prompt("YouTube URL:"); const id = window.getYoutubeId(u); if(id) window.execEditor('insertHTML', `<div class="aspect-video border rounded-xl overflow-hidden"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${id}"></iframe></div>`); };
        window.openEditor = () => { window.currentEditorId='post-fulltext'; document.getElementById('edit-post-id').value=''; document.getElementById('post-fulltext').innerHTML=''; document.getElementById('editor-modal').classList.remove('hidden'); };
        window.savePost = async () => { const id = document.getElementById('edit-post-id').value; const data = { title: document.getElementById('post-title').value, subtitle: document.getElementById('post-subtitle').value, fullText: document.getElementById('post-fulltext').innerHTML, status: document.querySelector('input[name="post_status"]:checked').value, type: document.querySelector('input[name="post_type"]:checked').value, category: document.getElementById('post-category').value, createdAt: Date.now() }; if(id) await updateDoc(doc(db,'artifacts',appId,'public','data','posts',id), data); else await addDoc(collection(db,'artifacts',appId,'public','data','posts'), data); window.closeEditor(); };
        window.editPost = (id) => { window.currentEditorId='post-fulltext'; const p = blogPosts.find(x=>x.id===id); document.getElementById('edit-post-id').value=p.id; document.getElementById('post-title').value=p.title; document.getElementById('post-fulltext').innerHTML=p.fullText; document.getElementById('editor-modal').classList.remove('hidden'); };
        window.getDriveImageUrl = (u) => { if(!u) return ""; const m = u.match(/\/d\/([a-zA-Z0-9_-]+)/); return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : u; };
        window.sharePost = async (id,t,s,e) => { e.stopPropagation(); const url = window.location.origin+window.location.pathname+'?post='+id; if(navigator.share) await navigator.share({title:t, text:s, url}); else { const el = document.createElement('textarea'); el.value = url; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); } };
    </script>
</body>
